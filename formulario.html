<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário para avaliar produtos instalados.">
    <title>Avaliação de Produto</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Slab:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="estilos/formulario.css">
    <script src="scripts/formulario.js" defer></script>
</head>

<body>
    <header>
        <h1>Avaliação de Produto</h1>
        <p>Conte para nós como foi a sua experiência.</p>
    </header>

    <main>
        <form action="avaliacao.html" method="get">

            <div class="campo">
                <label for="produto">Nome do produto</label>
                <select id="produto" name="produto" required>
                    <option value="" disabled selected>Selecione um Produto...</option>
                </select>
            </div>

            <fieldset class="classificacao">
                <legend>Classificação geral</legend>

                <div class="estrelas">
                    <label for="estrela-1" class="estrela">
                        <input type="radio" id="estrela-1" name="classificacao" value="1" required>
                        <span class="icone" aria-hidden="true">&starf;</span>
                        <span class="so-leitor">1 estrela</span>
                    </label>
                    <label for="estrela-2" class="estrela">
                        <input type="radio" id="estrela-2" name="classificacao" value="2" required>
                        <span class="icone" aria-hidden="true">&starf;</span>
                        <span class="so-leitor">2 estrelas</span>
                    </label>
                    <label for="estrela-3" class="estrela">
                        <input type="radio" id="estrela-3" name="classificacao" value="3" required>
                        <span class="icone" aria-hidden="true">&starf;</span>
                        <span class="so-leitor">3 estrelas</span>
                    </label>
                    <label for="estrela-4" class="estrela">
                        <input type="radio" id="estrela-4" name="classificacao" value="4" required>
                        <span class="icone" aria-hidden="true">&starf;</span>
                        <span class="so-leitor">4 estrelas</span>
                    </label>
                    <label for="estrela-5" class="estrela">
                        <input type="radio" id="estrela-5" name="classificacao" value="5" required>
                        <span class="icone" aria-hidden="true">&starf;</span>
                        <span class="so-leitor">5 estrelas</span>
                    </label>
                </div>
            </fieldset>

            <div class="campo">
                <label for="data-instalacao">Data de instalação</label>
                <input type="date" id="data-instalacao" name="data-instalacao" required>
            </div>

            <fieldset>
                <legend>Recursos úteis</legend>
                <p class="dica">Marque todos os que você achou úteis.</p>

                <div class="opcao">
                    <input type="checkbox" id="recurso-facil" name="recursos" value="facil-de-usar">
                    <label for="recurso-facil">Fácil de usar</label>
                </div>
                <div class="opcao">
                    <input type="checkbox" id="recurso-duravel" name="recursos" value="duravel">
                    <label for="recurso-duravel">Durável</label>
                </div>
                <div class="opcao">
                    <input type="checkbox" id="recurso-custo" name="recursos" value="custo-beneficio">
                    <label for="recurso-custo">Bom custo-benefício</label>
                </div>
                <div class="opcao">
                    <input type="checkbox" id="recurso-design" name="recursos" value="design">
                    <label for="recurso-design">Design atraente</label>
                </div>
            </fieldset>

            <div class="campo">
                <label for="avaliacao-escrita">Avaliação escrita <span class="opcional">(opcional)</span></label>
                <textarea id="avaliacao-escrita" name="avaliacao-escrita" rows="5"></textarea>
            </div>

            <div class="campo">
                <label for="nome-usuario">Seu nome <span class="opcional">(opcional)</span></label>
                <input type="text" id="nome-usuario" name="nome-usuario" autocomplete="name">
            </div>

            <input type="submit" value="Enviar avaliação">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="ano-atual"></span> Mário Henrique</p>
        <p>Última modificação: <span id="ultima-modificacao"></span></p>
    </footer>
</body>

</html>
