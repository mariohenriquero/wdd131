<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confirmação de envio da avaliação de produto.">
    <title>Avaliação Enviada</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Slab:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/formulario.css">
    <script src="scripts/avaliacao.js" defer></script>
</head>

<body>
    <header>
        <h1>Avaliação Enviada</h1>
        <p>Obrigado por compartilhar sua opinião!</p>
    </header>

    <main>
        <section class="confirmacao">
            <h2>Recebemos a sua avaliação</h2>
            <p>
                Você já concluiu
                <strong id="contador">0</strong>
                <span id="texto-contador">avaliações</span> neste navegador.
            </p>
            <a class="botao" href="formulario.html">Avaliar outro produto</a>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="ano-atual"></span> Mário Henrique</p>
        <p>Última modificação: <span id="ultima-modificacao"></span></p>
    </footer>

</html>
